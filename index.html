<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/einkaufstracker-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bons scannen, Ausgaben tracken, Inventar und Einkaufsliste">
  <meta name="theme-color" content="#2E7D32">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Einkaufstracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Einkaufstracker</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Automatisches Update (iOS-PWA-Strategie, kostenlose Alternative zum App Store, siehe
    ClaudeBrain 02 Projekte/Einkaufstracker/14 iOS-Strategie und Kosten.md): Flutters generierter
    Service Worker aktiviert eine neue Version bereits von sich aus sofort (skipWaiting) und laedt
    alle offenen Fenster neu (statt auf das Schliessen aller Tabs zu warten, wie in aelteren
    Flutter-Versionen). Diese Zeile sorgt zusaetzlich dafuer, dass bei JEDEM Start aktiv nach einer
    neuen Version gefragt wird, statt auf den naechsten browsereigenen Hintergrund-Check zu warten
    (Browser pruefen sonst nur gelegentlich, z.B. einmal pro Tag).
  -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (reg) reg.update();
        });
      });
    }
  </script>
</body>
</html>
